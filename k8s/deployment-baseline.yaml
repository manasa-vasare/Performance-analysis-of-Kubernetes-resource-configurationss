
apiVersion: apps/v1
kind: Deployment

metadata:
  name: performance-baseline
  namespace: k8s-performance

spec:
  replicas: 1

  selector:
    matchLabels:
      app: performance-baseline

  template:
    metadata:
      labels:
        app: performance-baseline

    spec:
      containers:
        - name: flask-app
          image: k8s-performance:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
